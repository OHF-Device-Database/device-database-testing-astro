name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Sync
        run: pnpm exec astro sync
      - name: Compile messages
        run: pnpm run i18n:compile
      # Not generated by the steps above and gitignored, but the layout imports
      # it, so typecheck needs it on disk.
      - name: Sync referrer allow list
        run: pnpm run sync:allowed-referrers
      - name: Format
        run: pnpm exec prettier --check .
      - name: Lint
        run: pnpm exec eslint .
      - name: Typecheck
        run: pnpm exec astro check
      - name: Test
        run: pnpm test
